# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: chaosmonkey

builds:
  - id: chaosmonkey
    main: ./cmd/chaosmonkey
    binary: chaosmonkey
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

dockers_v2:
  - dockerfile: build/Dockerfile.goreleaser
    images:
      - "ghcr.io/postfinance/chaosmonkey"
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
    platforms:
      - linux/amd64
      - linux/arm64

changelog:
  use: github
  sort: asc

release: {}
