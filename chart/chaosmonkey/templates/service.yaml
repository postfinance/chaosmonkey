apiVersion: v1
kind: Service
metadata:
  name: {{ include "chaosmonkey.fullname" . }}
  labels:
    {{- include "chaosmonkey.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    {{- include "chaosmonkey.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ include "chaosmonkey.port" . }}
      targetPort: http
      protocol: TCP
